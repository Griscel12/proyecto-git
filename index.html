<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi proyecto con Git</title>
    <style>
        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          font-family: Arial, sans-serif;
          background: #0f172a;
          color: #f1f5f9;
        }
        .tarjeta {
          background: #1e293b;
          padding: 2rem 2.5rem;
          border-radius: 12px;
          text-align: center;
          max-width: 420px;
        }
        h1 { margin-top: 0; }
        button {
          background: #f97316;
          color: white;
          border: none;
          padding: 0.7rem 1.4rem;
          border-radius: 8px;
          font-size: 1rem;
          cursor: pointer;
        }
        #contador { font-size: 2rem; margin: 1rem 0; }
    </style>
</head>
<body>
<div class="tarjeta">
    <h1>Hola, Git</h1>
    <p>Autor: TU NOMBRE AQUÍ</p>
    <div id="contador">0</div>
    <button onclick="sumar()">Sumar clic</button>
</div>

<script>
    let total = 0;
    function sumar() {
      total++;
      document.getElementById("contador").textContent = total;
    }
</script>
</body>
</html>
